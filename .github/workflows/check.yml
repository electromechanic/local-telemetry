name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: telemetry/ollama-gateway/go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.13.7'
      - name: Policy tests
        run: python3 -m unittest discover -s tests
      - name: Gateway tests and vet
        run: |
          go -C telemetry/ollama-gateway test -race ./...
          go -C telemetry/ollama-gateway vet ./...
      - name: OpenCode plugin tests
        run: node telemetry/opencode/avian_local_telemetry.test.mjs
      - name: Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          cd telemetry/ollama-gateway
          govulncheck ./...
