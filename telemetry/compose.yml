name: avian-codex-telemetry

services:
  lgtm:
    image: grafana/otel-lgtm:0.30.1@sha256:bb182ac3174a20923fa58f00d1790fa71eb06cc0150078c0b0e8feb9e6611492
    restart: unless-stopped
    labels:
      com.avian-golf.telemetry-config: "${TELEMETRY_CONFIG_REVISION:-unversioned}"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      # Codex, OpenCode, and the Alpaca proxy may emit delta-temporality data.
      # Prometheus drops it unless OTLP delta-to-cumulative conversion is enabled.
      PROMETHEUS_EXTRA_ARGS: "--enable-feature=otlp-deltatocumulative"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - avian-codex-telemetry-data:/data
      - ./collector/otelcol-config.yml:/otel-lgtm/otelcol-config.yaml:ro
      - ./grafana/provisioning/datasources/avian.yml:/otel-lgtm/grafana/conf/provisioning/datasources/avian.yml:ro
      - ./grafana/provisioning/dashboards/avian.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/avian.yml:ro
      - ./grafana/dashboards/avian-codex-workbench.json:/otel-lgtm/avian-codex-workbench.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:13133/ready >/dev/null && curl -fsS http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

volumes:
  avian-codex-telemetry-data:
    name: avian-codex-telemetry-data
    labels:
      # Historical label retained so the working Codex volume is reused safely.
      com.avian-golf.purpose: local-codex-telemetry
