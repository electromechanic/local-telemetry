apiVersion: 1

datasources:
  - name: Avian Metrics
    type: prometheus
    uid: avian-prometheus
    access: proxy
    url: http://127.0.0.1:9090
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: avian-tempo

  - name: Avian Logs
    type: loki
    uid: avian-loki
    access: proxy
    url: http://127.0.0.1:3100
    editable: false
    jsonData:
      derivedFields:
        - name: Trace
          matcherRegex: 'trace_id[=:]"?([a-f0-9]+)'
          url: '$${__value.raw}'
          datasourceUid: avian-tempo

  - name: Avian Traces
    type: tempo
    uid: avian-tempo
    access: proxy
    url: http://127.0.0.1:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: avian-loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        filterByTraceID: true
        filterBySpanID: false
      serviceMap:
        datasourceUid: avian-prometheus
      nodeGraph: {enabled: true}
      search: {hide: false}
